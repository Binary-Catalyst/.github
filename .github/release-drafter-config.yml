name-template: "$RESOLVED_VERSION 🌈"
tag-template: "$RESOLVED_VERSION"
categories:
  - title: "🚅 Emergency Hot-fixes"
    label: "hotfix"
  - title: "🚀 User Stories"
    label: "story"
  - title: "🐛 Bug Fixes"
    label: "bug"
  - title: "🧪 Research Spikes"
    label: "research"
  - title: "🧰 Maintenance and Choires"
    labels:
      - "maintenance"
  - title: "😎 Style"
    label: "style"
  - title: "📕 Documentation"
    label: "documentation"
change-template: "- $TITLE @$AUTHOR (#$NUMBER)"
change-title-escapes: '\<*_&'
autolabeler:
  - label: "story"
    branch:
      - '/^story\/.+/'
      - '/^user-story\/.+/'
      - '/^improvement\/.+/'
      - '/^enhancement\/.+/'
      - '/^feature\/.+/'
      - '/^feat\/.+/'
  - label: "major"
    branch:
      - '/^story\/.+/'
      - '/^user-story\/.+/'
      - '/^improvement\/.+/'
      - '/^enhancement\/.+/'
      - '/^feature\/.+/'
      - '/^feat\/.+/'
  - label: "bug"
    branch:
      - '/^bug\/.+/'
      - '/^fix\/.+/'
      - '/^bugfix\/.+/'
  - label: "patch"
    branch:
      - '/^bug\/.+/'
      - '/^fix\/.+/'
      - '/^bugfix\/.+/'
  - label: "maintenance"
    branch:
      - '/^maintenance\/.+/'
      - '/^refactor\/.+/'
      - '/^chore\/.+/'
  - label: "minor"
    branch:
      - '/^maintenance\/.+/'
      - '/^refactor\/.+/'
      - '/^chore\/.+/'
  - label: "research"
    branch:
      - '/^research\/.+/'
  - label: "minor"
    branch:
      - '/^research\/.+/'
  - label: "build"
    branch:
      - '/^build\/.+/'
      - '/^release\/.+/'
  - label: "hotfix"
    branch:
      - '/^hotfix\/.+/'
  - label: "patch"
    branch:
      - '/^hotfix\/.+/'
  - label: "major"
    branch:
      - '/^breaking\/.+/'
version-resolver:
  major:
    labels:
      - "major"
  minor:
    labels:
      - "minor"
      - "story"
      - "maintenance"
      - "research"
  patch:
    labels:
      - "patch"
      - "hotfix"
      - "bug"
      - "documentation"
      - "style"
      - "chore"
  default: patch
template: |
  $CHANGES
